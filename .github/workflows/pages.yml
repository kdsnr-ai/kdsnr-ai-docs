name: 독스 사이트 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: 사이트를 웹에 올린다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: try1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: try2
        if: steps.try1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: try4
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure' && steps.try3.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - id: try5
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure' && steps.try3.outcome == 'failure' && steps.try4.outcome == 'failure'
        uses: actions/deploy-pages@v4
