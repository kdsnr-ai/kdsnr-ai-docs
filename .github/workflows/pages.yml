name: 독스 사이트 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: 사이트를 웹에 올린다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 글마다 마지막으로 고친 날짜를 카드에 적는다
        run: python3 .github/stamp_updated.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 게시를 요청한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")][0].id')
          echo "올릴 꾸러미 번호 $artifact"

          ask() {
            oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
              -F artifact_id="$artifact" \
              -f pages_build_version="$GITHUB_SHA" \
              -f oidc_token="$oidc" >response.json 2>error.txt
          }

          if ask; then
            cat response.json
            exit 0
          fi
          cat error.txt response.json

          blocker=$(grep -hoE 'Please cancel [0-9a-f]{40}' error.txt response.json \
            | awk '{print $3}' | head -1)
          if [ -z "$blocker" ]; then
            echo "게시 요청이 받아들여지지 않았습니다"
            exit 1
          fi
          if [ "$blocker" = "$GITHUB_SHA" ]; then
            echo "같은 커밋의 게시가 이미 진행 중입니다. 건드리지 않고 끝냅니다."
            exit 0
          fi

          echo "앞 배포 $blocker 가 아직 줄에 남아 새 게시를 막고 있습니다. 그것만 취소합니다."
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$blocker/cancel" || true
          sleep 10
          if ask; then
            cat response.json
            exit 0
          fi
          cat error.txt response.json
          echo "앞 배포를 치운 뒤에도 게시 요청이 받아들여지지 않았습니다"
          exit 1

      - name: 사이트에 반영될 때까지 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: https://kdsnr-ai.github.io/kdsnr-ai-docs
        run: |
          changed=$(git diff --name-only HEAD^ HEAD \
            | grep -v '^\.github/' \
            | grep -E '^[A-Za-z0-9._/-]+$' \
            | head -1 || true)
          if [ -z "$changed" ] || [ ! -f "$changed" ]; then
            echo "이번 커밋은 사이트 파일을 바꾸지 않았습니다. 게시는 요청해 두었으므로 여기서 끝냅니다."
            exit 0
          fi
          want=$(sha256sum "$changed" | cut -d' ' -f1)
          echo "$changed 이 사이트에서 바뀌는지 본다"
          for i in $(seq 1 60); do
            sleep 30
            got=$(curl -sfL "$SITE/$changed?b=$i" 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            if [ "$want" = "$got" ]; then
              echo "$((i * 30))초 만에 $changed 이 사이트에 반영되었습니다"
              exit 0
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq .status 2>/dev/null || echo 조회실패)
            echo "$((i * 30))초 경과 · 상태 $state"
            case "$state" in
              succeed)
                echo "사이트에 올라갔습니다"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "게시가 실패했습니다: $state"
                exit 1
                ;;
            esac
          done
          echo "30분 동안 반영이 확인되지 않았습니다. 취소하지 않았으므로 요청은 살아 있고, GitHub이 처리하면 그대로 올라갑니다."
