name: 독스 사이트 올리기

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: 사이트를 웹에 올린다
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 게시를 요청한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "github-pages")][0].id')
          echo "올릴 꾸러미 번호 $artifact"
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$artifact" \
            -f pages_build_version="$GITHUB_SHA" \
            -f oidc_token="$oidc"

      - name: 올라갈 때까지 기다린다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 110); do
            sleep 30
            state=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$GITHUB_SHA" --jq .status 2>/dev/null || echo 조회실패)
            echo "$((i * 30))초 경과 · 상태 $state"
            case "$state" in
              succeed)
                echo "사이트에 올라갔습니다"
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "게시가 실패했습니다: $state"
                exit 1
                ;;
            esac
          done
          echo "55분 동안 차례가 오지 않았습니다. 취소하지 않았으므로 GitHub이 처리하는 대로 그대로 올라갑니다."
